name: CBL Visual QA

on:
  push:
    branches:
      - design/human-art-direction
    paths:
      - src/components/sections/HeroSection.tsx
      - src/components/visuals/GearmotorRenderSequence.tsx
      - src/components/ui/BackToTop.tsx
      - public/images/gearmotor/**
      - .github/workflows/visual-qa.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install Playwright for visual QA
        run: |
          npm install --no-save --package-lock=false playwright@latest
          npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Start app
        run: |
          npm start > /tmp/cbl-next.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cbl-next.log
          exit 1

      - name: Capture desktop and mobile hero states
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');

          async function capture(page, name, progress) {
            await page.evaluate((p) => {
              const hero = document.querySelector('[aria-label="Visualisasi interaktif sistem gearmotor CBL"]');
              if (!hero) throw new Error('Hero section not found');
              const max = Math.max(1, hero.scrollHeight - window.innerHeight);
              window.scrollTo(0, hero.getBoundingClientRect().top + window.scrollY + max * p);
            }, progress);
            await page.waitForTimeout(550);
            await page.screenshot({ path: `visual-qa/${name}.png` });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
            await desktop.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
            await desktop.waitForTimeout(900);
            for (const [label, p] of [['00', 0], ['01', 0.12], ['03', 0.34], ['05', 0.56], ['07', 0.76], ['09', 0.94]]) {
              await capture(desktop, `desktop-${label}`, p);
            }

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 1 });
            await mobile.goto('http://127.0.0.1:3000/', { waitUntil: 'networkidle' });
            await mobile.waitForTimeout(900);
            for (const [label, p] of [['00', 0], ['04', 0.46], ['09', 0.94]]) {
              await capture(mobile, `mobile-${label}`, p);
            }

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: cbl-visual-qa
          path: visual-qa/*.png
          retention-days: 3
