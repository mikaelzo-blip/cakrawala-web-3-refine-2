name: CBL Publish Gearmotor Assets

on:
  workflow_dispatch:
  push:
    branches:
      - design/human-art-direction
    paths:
      - .github/workflows/publish-gearmotor-assets.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: design/human-art-direction

      - name: Find latest successful Blender render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list \
            --workflow "CBL Gearmotor Render QA" \
            --branch design/human-art-direction \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Using render run $RUN_ID"

      - name: Download approved render artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/cbl-gearmotor
          gh run download "$RUN_ID" \
            --name cbl-gearmotor-render-qa \
            --dir /tmp/cbl-gearmotor
          test -f /tmp/cbl-gearmotor/step-00.png
          test -f /tmp/cbl-gearmotor/step-09.png

      - name: Optimize transparent renders to WebP
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
          rm -rf public/images/gearmotor
          mkdir -p public/images/gearmotor
          for source in /tmp/cbl-gearmotor/step-*.png; do
            name=$(basename "${source%.png}")
            cwebp -quiet -q 82 -m 4 "$source" -o "public/images/gearmotor/$name.webp"
          done
          ls -lh public/images/gearmotor
          test "$(find public/images/gearmotor -name 'step-*.webp' | wc -l)" -eq 10

      - name: Commit optimized web assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/gearmotor
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "assets: publish optimized gearmotor renders"
          git push origin HEAD:design/human-art-direction
